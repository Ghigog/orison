name: CI

on:
  push:
  pull_request:

env:
  # Matched to the version developed against locally. 4.7 was verified against
  # the full unit suite (46/46) and the eval harness with byte-identical results
  # to 4.6, so this is a version bump with no behavioural change. project.godot
  # still declares 4.6 in config/features, which is forward-compatible and left
  # alone deliberately: rewriting it triggers an editor migration pass on a
  # codebase the migration plan replaces outright.
  GODOT_VERSION: "4.7-stable"

jobs:
  tests:
    name: Godot test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot headless binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot headless binary
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -fL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Add Godot to PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Import project assets
        # Cold checkouts have no .godot import cache. Godot can behave as
        # though resources are missing (or fail the run entirely) if the
        # test scene is booted before an import pass has ever happened.
        run: godot --headless --path . --import
        continue-on-error: true

      - name: Run test suite
        id: run_tests
        run: |
          set +e
          godot --headless --path . res://tests/TestRunner.tscn 2>&1 | tee godot_test_output.log
          echo "godot_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Verify results
        run: |
          godot_exit="${{ steps.run_tests.outputs.godot_exit }}"
          echo "Godot process exit code: $godot_exit"

          summary_line="$(grep -E 'Test Results: [0-9]+ / [0-9]+ Tests Passed' godot_test_output.log || true)"
          if [ -z "$summary_line" ]; then
            echo "::error::No 'Test Results: N / M Tests Passed' summary line found in output. The suite likely crashed before completing."
            exit 1
          fi
          echo "Summary line: $summary_line"

          passed="$(echo "$summary_line" | grep -oE '[0-9]+' | sed -n '1p')"
          total="$(echo "$summary_line" | grep -oE '[0-9]+' | sed -n '2p')"

          # TestRunnerNode.gd already calls get_tree().quit(0 if pass_count ==
          # total_tests else 1) on its final line, so the exit code alone
          # should be sufficient. Godot has historically been inconsistent
          # about propagating exit codes through the headless binary across
          # versions and platforms, so this step trusts the parsed summary
          # line as the source of truth and additionally checks the process
          # exit code as a second, independent signal. Either one failing
          # fails the job.
          if [ "$passed" != "$total" ]; then
            echo "::error::Test summary reports $passed / $total tests passed."
            exit 1
          fi

          if [ "$godot_exit" != "0" ]; then
            echo "::error::Test summary reports all $total tests passed, but the Godot process exited with code $godot_exit. Treating this as a failure since a nonzero exit on a fully-passing run indicates the exit code is not trustworthy on this runner."
            exit 1
          fi

          echo "All $total tests passed and the process exit code was 0."

  lint:
    name: Lint (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The codebase has never been linted; the first run is expected to
    # surface a large number of findings. This job is intentionally
    # non-blocking (see the follow-up triage issue) rather than gating on
    # a 19,600-line reformat done in the same change as CI setup.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"

      - name: gdformat --check
        run: gdformat --check src/ tests/
        continue-on-error: true

      - name: gdlint
        run: gdlint src/ tests/
        continue-on-error: true

  eval:
    name: Evaluation harness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Phase 1 of the migration plan. Runs in replay mode against the synthetic
    # cassette, so it needs no Ollama and no models. It gates on the harness
    # SELF-TEST rather than on the metric values: the synthetic cassette
    # deliberately contains one planted defect per metric, so a run where the
    # transcript metrics all pass means the harness has stopped working.
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot headless binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot headless binary
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -fL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Add Godot to PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Verify the large fixture is in sync with its generator
        # The generator is seeded, so regenerating must be a no-op. If this
        # fails, someone hand-edited generated files and the ground-truth
        # labels may no longer point at the notes they claim to.
        run: |
          before="$(find fixtures/vaults/large -type f -print0 | sort -z | xargs -0 cat | md5sum)"
          python3 fixtures/generate_large_vault.py
          after="$(find fixtures/vaults/large -type f -print0 | sort -z | xargs -0 cat | md5sum)"
          if [ "$before" != "$after" ]; then
            echo "::error::fixtures/vaults/large is out of sync with generate_large_vault.py."
            git --no-pager diff --stat -- fixtures/vaults/large || true
            exit 1
          fi
          echo "Large fixture matches its generator."

      - name: Import project assets
        run: godot --headless --path . --import
        continue-on-error: true

      - name: Run evaluation harness
        # The explicit timeout is not belt-and-braces. If EvalRunnerNode.gd
        # fails to parse, Godot loads the scene with no script attached and the
        # process never exits; without this the job would burn its full budget
        # on a hang rather than reporting a parse error.
        run: |
          set -o pipefail
          timeout 600 godot --headless --path . res://eval/EvalRunner.tscn -- \
            --fixture=all --selftest --out=user://eval_results.json \
            2>&1 | tee eval_output.log
          code=$?
          if [ $code -eq 124 ]; then
            echo "::error::Evaluation harness timed out. Check for a GDScript parse error in eval/."
            exit 1
          fi
          exit $code

      - name: Confirm the harness still detects planted defects
        run: |
          if grep -q "harness detected all" eval_output.log; then
            grep "harness detected all" eval_output.log
          else
            echo "::error::Harness self-test did not pass. A metric that never fires is not a metric."
            grep -E "SELF-TEST|harness MISSED" -A3 eval_output.log || true
            exit 1
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval_output.log
          retention-days: 14

  rust:
    name: Rust workspace (orison-core)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Phase 2 of the migration plan. `llama-cpp-2` (the LlamaCppBackend,
    # §2.3) is deliberately left out of this job: it builds llama.cpp from
    # source via cmake and a C++ toolchain, which is slow and not what this
    # job is for. Build it with `--features llama-cpp` on a machine set up
    # for it. Nothing here needs a live Ollama: the conformance suite's
    # live-backend cases are gated behind env vars this job does not set,
    # the same pattern the eval harness above uses for --live.
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri's Linux build dependencies
        # apps/desktop/src-tauri (Phase 6) joined this workspace, so
        # `--workspace` below now builds `wry`/`tao`, which link against
        # webkit2gtk and friends. Not needed to check out or test
        # orison-core/orison-cli alone, but --workspace does both in one
        # job and ubuntu-latest does not carry these by default.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace
