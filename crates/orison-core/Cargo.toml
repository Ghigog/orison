[package]
name = "orison-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Orison engine core: inference, ingest, knowledge, retrieval, prompt, turn, memory, state. No UI, no platform assumptions."

[dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
futures-core = { workspace = true }
tokenizers = { workspace = true }
rusqlite = { workspace = true }
rusqlite_migration = { workspace = true }
sqlite-vec = { workspace = true }
petgraph = { workspace = true }
tantivy = { workspace = true }
ndarray = { workspace = true }
linfa = { workspace = true }
linfa-clustering = { workspace = true }
llama-cpp-2 = { version = "0.1", optional = true }
encoding_rs = { version = "0.8", optional = true }

[features]
# The stand-in Ollama in `testing`. Enabled by this crate's own dev-dependency
# on itself and by `orison-cli`'s, so both play against one stand-in rather
# than two that can drift apart.
test-support = ["tokio/net", "tokio/io-util"]
# Off by default: llama-cpp-2 builds llama.cpp from source (cmake + a C++
# toolchain) and that build is slow and network-dependent. Enable explicitly
# with `cargo build --features llama-cpp` on a machine set up for it. The
# conformance suite still compiles either way; the LlamaCpp-specific cases are
# `#[cfg(feature = "llama-cpp")]` and skipped otherwise.
llama-cpp = ["dep:llama-cpp-2", "dep:encoding_rs"]

[dev-dependencies]
# `net` and `io-util` are for the hand-rolled Ollama stand-in in `testing`:
# the cancellation test has to observe a real socket closing, which is the
# only way to prove a request actually stopped.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util", "net", "io-util"] }
tempfile = "3"
# The crate's own tests use its `test-support` module. A dev-dependency on
# self is how a feature is enabled for tests without enabling it for
# consumers.
orison-core = { path = ".", features = ["test-support"] }
